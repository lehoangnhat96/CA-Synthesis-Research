services:
  pdf-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca-pdf-processor
    working_dir: /app
    volumes:
      - ./:/app
      - cache_volume:/app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    command: python scripts/convert_pdfs.py
    restart: "no"

  classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca-classifier
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: python scripts/classify_all_auto.py
    depends_on:
      - pdf-processor
    restart: "no"

volumes:
  cache_volume:
